<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技术动作慢放 Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>技术动作慢放 Studio</h1>
  <p id="range-note">支持速率范围加载中…</p>
</header>

<main>
  <section class="panel">
    <h2>1. 源视频</h2>
    <div class="row">
      <input type="file" id="file-input" accept="video/*">
      <button id="btn-sample" type="button">生成合成示例视频</button>
      <span id="upload-status"></span>
    </div>
    <video id="src-video" controls preload="metadata"></video>
    <div id="src-meta" class="meta"></div>
  </section>

  <section class="panel">
    <h2>2. 圈定区间与速度</h2>
    <div class="row">
      <button id="btn-set-in" type="button">设为入点</button>
      <label>入点 <input id="in-sec" type="number" step="0.01" min="0" value="0"> s</label>
      <button id="btn-set-out" type="button">设为出点</button>
      <label>出点 <input id="out-sec" type="number" step="0.01" min="0" value="0"> s</label>
    </div>
    <div class="row">
      <label>播放速率
        <input id="rate" type="range" min="0.25" max="2" step="0.05" value="0.5">
        <input id="rate-num" type="number" step="0.05" value="0.5" style="width:5em">
      </label>
      <span id="est-duration" class="meta"></span>
    </div>
    <div class="row">
      <button id="btn-render" type="button" disabled>生成慢放片段</button>
      <span id="render-status"></span>
    </div>
    <p class="hint">速率超出支持范围会被内核拒绝；慢放结果由服务端 WSOLA 音频时间伸缩 + 媒体时钟取帧真实渲染，不依赖浏览器 playbackRate。</p>
  </section>

  <section class="panel" id="result-panel" hidden>
    <h2>3. 结果：循环动作</h2>
    <video id="out-video" controls loop autoplay muted="false"></video>
    <div class="row position-row">
      <span id="pos-text">播放位置: —</span>
      <div class="progress"><div id="pos-bar"></div></div>
    </div>
    <table id="stats-table"></table>
    <div class="row"><a id="download-link" download="slowmo.mp4">下载慢放片段</a></div>
  </section>

  <div id="error-box" hidden></div>
</main>

<script src="/app.js"></script>
</body>
</html>
